services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"   # Jenkins UI
      - "50000:50000" # inbound agents
      - "8081:5000"   # staging Flask app deployed by the pipeline
    environment:
      JENKINS_ADMIN_ID: "${JENKINS_ADMIN_ID:-admin}"
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:-admin}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:-local-staging-secret}"
    volumes:
      - jenkins_home:/var/jenkins_home
    depends_on:
      - mongo
      - mailpit

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI for viewing build notification emails
      - "1025:1025" # SMTP endpoint Jenkins sends to

volumes:
  jenkins_home:
  mongo_data:
